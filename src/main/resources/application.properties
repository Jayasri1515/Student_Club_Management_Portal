spring.application.name=club_management

# --- Database ---------------------------------------------------------------
# Credentials are NEVER stored in this file. Supply them at runtime through
# environment variables (or a git-ignored application-local.properties, see
# docs/DATABASE_CONFIG.md). The application refuses to start if DB_USERNAME or
# DB_PASSWORD is missing/blank (see DatabaseEnvironmentValidator).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/club_db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Explicitly enable and defer data source initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# The backend has no authentication. Leave-club and activity update/delete answer 403 unless this is
# switched on, which is for local development only (see docs/UNAUTHENTICATED_WRITES.md).
app.unauthenticated-writes.enabled=${APP_ENABLE_UNAUTHENTICATED_WRITES:false}

# Server port for the backend
server.port=8082
